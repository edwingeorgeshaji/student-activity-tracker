<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <defs>
    <clipPath id="tile"><rect x="2" y="2" width="146" height="146" rx="27"/></clipPath>
    <pattern id="airmail" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="18" fill="#df4038"/>
      <rect x="9" width="9" height="18" fill="#287db8"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="0.9" y2="1">
