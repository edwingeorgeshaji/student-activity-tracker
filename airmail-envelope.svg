<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <defs>
    <clipPath id="tileClip"><rect x="2" y="2" width="146" height="146" rx="27"/></clipPath>
    <pattern id="airmail" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="24" fill="#df4038"/>
      <rect x="12" width="12" height="24" fill="#287db8"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edf0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g clip-path="url(#tileClip)">
    <rect x="2" y="2" width="146" height="146" rx="27" fill="#f7f8f8"/>
    <rect x="2" y="2" width="146" height="146" rx="27" fill="none" stroke="url(#airmail)" stroke-width="16"/>
    <rect x="13" y="13" width="124" height="124" rx="15" fill="url(#paper)"/>
    <path d="M14 38 75 88 136 38" fill="none" stroke="#d9dfe3" stroke-width="2"/>
    <path d="M14 132 58 91 75 105 92 91 136 132" fill="none" stroke="#dfe3e6" stroke-width="2"/>
    <g filter="url(#softShadow)">
      <path d="M14 34 67 78Q75 85 83 78L136 34V39L83 88Q75 95 67 88L14 39Z" fill="#d6dce0"/>
      <path d="M14 31 67 76Q75 83 83 76L136 31V37L83 84Q75 91 67 84L14 37Z" fill="#ffffff"/>
    </g>
    <path d="M14 132 58 91M136 132 92 91" fill="none" stroke="#ffffff" stroke-width="3" opacity=".8"/>
  </g>
</svg>